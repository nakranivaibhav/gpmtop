[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpmtop"
dynamic = ["version"]
description = "See what your NVIDIA GPU is bound by, live: a speed-of-light view of GPM metrics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vaibhav Nakrani" }]
requires-python = ">=3.9"
dependencies = ["rich>=13"]
keywords = ["gpu", "nvidia", "cuda", "monitoring", "profiling", "pytorch", "tui"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/nakranivaibhav/gpmtop"
Issues = "https://github.com/nakranivaibhav/gpmtop/issues"

[project.scripts]
gpmtop = "gpmtop:main"

[tool.hatch.version]
path = "src/gpmtop/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["assets", ".github"]
